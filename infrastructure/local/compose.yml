services:
  postgres:
    image: postgres:17
    container_name: mocha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mocha_house
      POSTGRES_USER: mocha
      POSTGRES_PASSWORD: mocha_local_dev
    ports:
      - "5433:5432"
    volumes:
      - mocha_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: mocha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mocha_redis_data:/data

volumes:
  mocha_postgres_data:
  mocha_redis_data: